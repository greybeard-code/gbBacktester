[pytest]
testpaths = tests
# plain `pytest` = the fast, data-free unit suite. Data tests are opt-in:
#   pytest -m "data and not slow"   (~15 s)      pytest -m "data and slow"   (~4 min)
# (a -m on the command line replaces this default)
addopts = --strict-markers -m "not data"
markers =
    data: needs BACKTESTER_DATA_ROOT (real tick data); skipped otherwise
    slow: long-running (full-history runs); run by hand or weekly
    real_default_latency: runs with the engine's REAL default order latency (conftest zeroes it for every other unit test)
